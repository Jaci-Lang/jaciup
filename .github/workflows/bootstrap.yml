name: bootstrap-release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Bootstrap version (e.g. 0.1.0 or v0.1.0)"
        default: "0.1.0"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false

permissions:
  contents: write

jobs:
  build-bootstrap:
    name: bootstrap-x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone KLUR
        # The bootstrap build compiles jaciup's @klur/* requires against the
        # KLUR stdlib; .luaurc aliases it to ../klur/src/std, so the klur
        # repo must be checked out as a sibling.
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/Jaci-Lang/klur.git \
            ../klur

      - name: Download Jaci Engine Bootstrap
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://pop.squareweb.app"
          API_URL="${BASE_URL}/v1/releases/latest?product=jaci"

          echo "Fetching latest Jaci release..."

          # The releases API is briefly inconsistent while a new release is
          # being published; retry before failing.
          RESPONSE=""
          URL=""
          for attempt in 1 2 3; do
            RESPONSE="$(curl -fsSL "$API_URL" || true)"
            URL="$(
              printf '%s' "$RESPONSE" |
                jq -r '
                  (.assets // [])[]
                  | select(.name == "luau-x86_64-unknown-linux-gnu.zip")
                  | .download_url
                ' 2>/dev/null |
                head -n 1
            )"
            if [[ -n "$URL" && "$URL" != "null" ]]; then
              break
            fi
            echo "Attempt $attempt: could not resolve engine artifact; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "Failed to find luau-x86_64-unknown-linux-gnu.zip"
            echo "Available assets:"
            printf '%s' "$RESPONSE" | jq -r '(.assets // [])[] | .name' 2>/dev/null || true
            exit 1
          fi

          if [[ "$URL" == /* ]]; then
            URL="${BASE_URL}${URL}"
          fi

          echo "Downloading: $URL"

          curl -fSL \
            --retry 3 \
            --retry-delay 2 \
            -o jaci.zip \
            "$URL"

          rm -rf /tmp/jaci
          mkdir -p /tmp/jaci

          unzip -o -q jaci.zip -d /tmp/jaci

          echo "Extracted files:"
          find /tmp/jaci -maxdepth 2 -type f -print

          LUAU_BIN="$(find /tmp/jaci -type f -name luau | head -n 1)"

          if [[ -z "$LUAU_BIN" ]]; then
            echo "Could not find luau binary in archive"
            exit 1
          fi

          chmod +x "$LUAU_BIN"
          sudo cp "$LUAU_BIN" /usr/local/bin/luau

          echo "Installed Luau:"
          command -v luau
          luau --version || true

      - name: Build Standalone Jaciup Binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          luau \
            --build src/init.luau \
            --direct \
            -o dist/jaciup

          chmod +x dist/jaciup

          test -f dist/jaciup

          cd dist
          zip -j -9 ../jaciup-x86_64-unknown-linux-gnu.zip jaciup

      - name: Upload Bootstrap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaciup-bootstrap-x86_64-unknown-linux-gnu
          path: jaciup-x86_64-unknown-linux-gnu.zip
          if-no-files-found: error
          retention-days: 1

  publish-bootstrap:
    name: publish-bootstrap
    needs: build-bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          VER="${{ inputs.version }}"

          if [[ "$VER" != v* ]]; then
            VER="v$VER"
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Release version: $VER"

      - name: Download Bootstrap Artifact
        uses: actions/download-artifact@v4
        with:
          name: jaciup-bootstrap-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Prepare Release Assets and Checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          cp \
            artifacts/jaciup-x86_64-unknown-linux-gnu.zip \
            release-assets/jaciup-x86_64-unknown-linux-gnu.zip

          cd release-assets

          sha256sum \
            jaciup-x86_64-unknown-linux-gnu.zip \
            > SHA256SUMS.txt

          awk '{print $1}' SHA256SUMS.txt \
            > jaciup-x86_64-unknown-linux-gnu.zip.sha256

          echo "Release assets:"
          ls -lah

          echo
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Bootstrap Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/jaciup-x86_64-unknown-linux-gnu.zip
            release-assets/jaciup-x86_64-unknown-linux-gnu.zip.sha256
            release-assets/SHA256SUMS.txt