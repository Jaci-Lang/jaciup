name: bootstrap-release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Bootstrap version (e.g. 0.1.0 or v0.1.0)"
        default: "0.1.0"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false

permissions:
  contents: write

jobs:
  build-bootstrap:
    strategy:
      matrix:
        os: [
          {name: x86_64-unknown-linux-gnu, runner: ubuntu-22.04},
          {name: x86_64-apple-darwin, runner: macos-13},
          {name: aarch64-apple-darwin, runner: macos-14},
          {name: x86_64-pc-windows-msvc, runner: windows-latest}
        ]
    name: bootstrap-${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Jaci Engine Source
        uses: actions/checkout@v4
        with:
          repository: Jaci-Lang/jaci
          path: jaci-src
          fetch-depth: 1

      - name: Build Jaci Engine from Source (Unix)
        if: matrix.os.name != 'x86_64-pc-windows-msvc'
        run: |
          cd jaci-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_STRIP_BINARIES=ON -DLUAU_ENABLE_LTO=ON
          cmake --build build --target Luau.Repl.CLI -j 4
          sudo cp build/luau /usr/local/bin/luau || cp build/luau /usr/local/bin/luau || true
          cd ..

      - name: Build Jaci Engine from Source (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          cd jaci-src
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLUAU_STRIP_BINARIES=ON -DLUAU_ENABLE_LTO=ON
          cmake --build build --target Luau.Repl.CLI -j 4
          Copy-Item build/Release/luau.exe -Destination C:/Windows/System32/luau.exe -Force
          cd ..

      - name: Build Standalone Jaciup Binary (Unix)
        if: matrix.os.name != 'x86_64-pc-windows-msvc'
        run: |
          mkdir -p dist
          luau --build src/init.luau --direct --codegen --strip -o dist/jaciup
          chmod +x dist/jaciup
          cd dist
          zip -j -9 ../jaciup-${{ matrix.os.name }}.zip jaciup

      - name: Build Standalone Jaciup Binary (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        run: |
          mkdir -p dist
          luau.exe --build src/init.luau --direct --codegen --strip -o dist/jaciup.exe
          7z a -mx=9 jaciup-${{ matrix.os.name }}.zip .\dist\jaciup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: jaciup-bootstrap-${{ matrix.os.name }}
          path: jaciup-${{ matrix.os.name }}.zip
          retention-days: 1

  publish-bootstrap:
    needs: build-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag
        run: |
          VER="${{ github.event.inputs.version }}"
          [[ "$VER" != v* ]] && VER="v$VER"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;
          cd release-assets
          for f in *.zip; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          sha256sum *.zip > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Bootstrap Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Jaciup Bootstrap ${{ steps.tag.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true
