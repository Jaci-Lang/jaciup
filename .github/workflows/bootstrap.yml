name: bootstrap-release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Bootstrap version (e.g. 0.1.0 or v0.1.0)"
        default: "0.1.0"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false

permissions:
  contents: write

jobs:
  build-bootstrap:
    name: bootstrap-x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Jaci Engine Bootstrap
        run: |
          URL=$(curl -sL "https://pop.squareweb.app/v1/releases/latest?product=jaci" | jq -r '.artifacts["x86_64-unknown-linux-gnu"].url')
          curl -fSL -o jaci.zip "$URL"
          unzip -o -q jaci.zip -d /tmp/jaci
          chmod +x /tmp/jaci/*
          sudo cp /tmp/jaci/luau /usr/local/bin/luau || sudo cp /tmp/jaci/luau* /usr/local/bin/luau || true

      - name: Build Standalone Jaciup Binary
        run: |
          mkdir -p dist
          luau --build src/init.luau --direct --codegen --strip -o dist/jaciup
          chmod +x dist/jaciup
          cd dist
          zip -j -9 ../jaciup-x86_64-unknown-linux-gnu.zip jaciup

      - uses: actions/upload-artifact@v4
        with:
          name: jaciup-bootstrap-x86_64-unknown-linux-gnu
          path: jaciup-x86_64-unknown-linux-gnu.zip
          retention-days: 1

  publish-bootstrap:
    needs: build-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag
        run: |
          VER="${{ github.event.inputs.version }}"
          [[ "$VER" != v* ]] && VER="v$VER"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;
          cd release-assets
          for f in *.zip; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          sha256sum *.zip > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Bootstrap Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Jaciup Bootstrap ${{ steps.tag.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true
