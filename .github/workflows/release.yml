name: release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [
          {name: x86_64-unknown-linux-gnu, runner: ubuntu-22.04},
          {name: x86_64-apple-darwin, runner: macos-13},
          {name: aarch64-apple-darwin, runner: macos-14},
          {name: x86_64-pc-windows-msvc, runner: windows-latest}
        ]
    name: build-${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Jaci Engine Bootstrap (Ubuntu)
        if: matrix.os.name == 'x86_64-unknown-linux-gnu'
        run: |
          URL=$(curl -sL "https://pop.squareweb.app/v1/releases/latest?product=luau" | jq -r '.artifacts["${{ matrix.os.name }}"].url')
          curl -fSL -o luau-${{ matrix.os.name }}.zip "$URL"
          unzip -o -q luau-${{ matrix.os.name }}.zip -d /tmp/jaci
          chmod +x /tmp/jaci/*
          sudo cp /tmp/jaci/luau /usr/local/bin/luau || sudo cp /tmp/jaci/luau* /usr/local/bin/luau || true

      - name: Download Jaci Engine Bootstrap (macOS)
        if: matrix.os.name == 'x86_64-apple-darwin' || matrix.os.name == 'aarch64-apple-darwin'
        run: |
          URL=$(curl -sL "https://pop.squareweb.app/v1/releases/latest?product=luau" | jq -r '.artifacts["${{ matrix.os.name }}"].url')
          curl -fSL -o luau-${{ matrix.os.name }}.zip "$URL"
          unzip -o -q luau-${{ matrix.os.name }}.zip -d /tmp/jaci
          chmod +x /tmp/jaci/*
          sudo cp /tmp/jaci/luau /usr/local/bin/luau || cp /tmp/jaci/luau /usr/local/bin/luau || true

      - name: Download Jaci Engine Bootstrap (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $json = Invoke-RestMethod -Uri "https://pop.squareweb.app/v1/releases/latest?product=luau"
          $url = $json.artifacts."${{ matrix.os.name }}".url
          Invoke-WebRequest -Uri $url -OutFile luau-${{ matrix.os.name }}.zip
          Expand-Archive -Path luau-${{ matrix.os.name }}.zip -DestinationPath C:\jaci -Force
          echo "C:\jaci" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Standalone Jaciup Binary (Unix)
        if: matrix.os.name != 'x86_64-pc-windows-msvc'
        run: |
          mkdir -p dist
          luau --build src/init.luau --direct --codegen --strip -o dist/jaciup
          chmod +x dist/jaciup
          cd dist
          zip -j -9 ../jaciup-${{ matrix.os.name }}.zip jaciup

      - name: Build Standalone Jaciup Binary (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        run: |
          mkdir -p dist
          luau.exe --build src/init.luau --direct --codegen --strip -o dist/jaciup.exe
          7z a -mx=9 jaciup-${{ matrix.os.name }}.zip .\dist\jaciup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: jaciup-${{ matrix.os.name }}
          path: jaciup-${{ matrix.os.name }}.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            [[ "$VER" != v* ]] && VER="v$VER"
            echo "version=$VER" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-assets
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;
          cd release-assets
          for f in *.zip; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          sha256sum *.zip > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Jaciup ${{ steps.tag.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true
