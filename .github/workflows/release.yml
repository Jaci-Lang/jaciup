name: release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - name: x86_64-apple-darwin
            runner: macos-15-intel
          - name: aarch64-apple-darwin
            runner: macos-14
          - name: x86_64-pc-windows-msvc
            runner: windows-latest

    name: build-${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Jaciup Toolchain (Ubuntu)
        if: matrix.os.name == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://pop.squareweb.app"
          ASSET="jaciup-${{ matrix.os.name }}.zip"

          URL=$(
            curl -fsSL "${BASE_URL}/v1/releases/latest?product=jaciup" |
            jq -r --arg asset "$ASSET" '
              .assets[]
              | select(.name == $asset)
              | .download_url
            ' |
            head -n 1
          )

          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "Could not find asset: $ASSET"
            exit 1
          fi

          if [[ "$URL" == /* ]]; then
            URL="${BASE_URL}${URL}"
          fi

          echo "Downloading $URL"

          curl -fSL -o jaciup.zip "$URL"

          rm -rf /tmp/jaciup
          mkdir -p /tmp/jaciup
          unzip -o -q jaciup.zip -d /tmp/jaciup

          chmod +x /tmp/jaciup/jaciup
          sudo cp /tmp/jaciup/jaciup /usr/local/bin/jaciup

          jaciup init -y || true
          jaciup toolchain install latest

          echo "$HOME/.jaciup/bin" >> "$GITHUB_PATH"

      - name: Setup Jaciup Toolchain (macOS)
        if: matrix.os.name == 'x86_64-apple-darwin' || matrix.os.name == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://pop.squareweb.app"
          ASSET="jaciup-${{ matrix.os.name }}.zip"

          URL=$(
            curl -fsSL "${BASE_URL}/v1/releases/latest?product=jaciup" |
            jq -r --arg asset "$ASSET" '
              .assets[]
              | select(.name == $asset)
              | .download_url
            ' |
            head -n 1
          )

          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "Could not find asset: $ASSET"
            exit 1
          fi

          if [[ "$URL" == /* ]]; then
            URL="${BASE_URL}${URL}"
          fi

          echo "Downloading $URL"

          curl -fSL -o jaciup.zip "$URL"

          rm -rf /tmp/jaciup
          mkdir -p /tmp/jaciup
          unzip -o -q jaciup.zip -d /tmp/jaciup

          chmod +x /tmp/jaciup/jaciup
          sudo cp /tmp/jaciup/jaciup /usr/local/bin/jaciup

          jaciup init -y || true
          jaciup toolchain install latest

          echo "$HOME/.jaciup/bin" >> "$GITHUB_PATH"

      - name: Setup Jaciup Toolchain (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $base = "https://pop.squareweb.app"
          $asset = "jaciup-${{ matrix.os.name }}.zip"

          $json = Invoke-RestMethod `
            -Uri "$base/v1/releases/latest?product=jaciup"

          $entry = $json.assets |
            Where-Object { $_.name -eq $asset } |
            Select-Object -First 1

          if (-not $entry) {
            throw "Could not find asset: $asset"
          }

          $url = $entry.download_url

          if ($url.StartsWith("/")) {
            $url = "$base$url"
          }

          Write-Host "Downloading $url"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile jaciup.zip

          Remove-Item C:\jaciup -Recurse -Force -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path jaciup.zip `
            -DestinationPath C:\jaciup `
            -Force

          "C:\jaciup" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          C:\jaciup\jaciup.exe init -y
          C:\jaciup\jaciup.exe toolchain install latest

          $home = [Environment]::GetFolderPath("UserProfile")

          "$home\.jaciup\bin" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Build Standalone Jaciup Binary (Unix)
        if: matrix.os.name != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          luau \
            --build src/init.luau \
            --direct \
            --codegen \
            --strip \
            -o dist/jaciup

          chmod +x dist/jaciup

          cd dist

          zip -j -9 \
            "../jaciup-${{ matrix.os.name }}.zip" \
            jaciup

      - name: Build Standalone Jaciup Binary (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          luau.exe `
            --build src/init.luau `
            --direct `
            --codegen `
            --strip `
            -o dist/jaciup.exe

          7z a `
            -mx=9 `
            "jaciup-${{ matrix.os.name }}.zip" `
            ".\dist\jaciup.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaciup-${{ matrix.os.name }}
          path: jaciup-${{ matrix.os.name }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"

            if [[ "$VER" != v* ]]; then
              VER="v$VER"
            fi

            echo "version=$VER" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find artifacts \
            -type f \
            -name "*.zip" \
            -exec cp {} release-assets/ \;

          cd release-assets

          for f in *.zip; do
            sha256sum "$f" |
              awk '{print $1}' \
              > "$f.sha256"
          done

          sha256sum *.zip > SHA256SUMS.txt

          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Jaciup ${{ steps.tag.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true