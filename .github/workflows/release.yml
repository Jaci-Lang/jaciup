name: release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Release version (e.g. 0.1.0 or v0.1.0)"
      draft:
        type: boolean
        description: "Create as draft release"
        default: false
      prerelease:
        type: boolean
        description: "Mark as prerelease"
        default: false
      build_linux_x86_64:
        type: boolean
        description: "Build x86_64-unknown-linux-gnu"
        default: true
      build_macos_x86_64:
        type: boolean
        description: "Build x86_64-apple-darwin (macOS Intel)"
        default: true
      build_macos_arm64:
        type: boolean
        description: "Build aarch64-apple-darwin (macOS Apple Silicon)"
        default: true
      build_windows_x64:
        type: boolean
        description: "Build x86_64-pc-windows-msvc (Windows x64)"
        default: true

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((
          ((inputs.build_linux_x86_64 == true)  ? '[{"name":"x86_64-unknown-linux-gnu","runner":"ubuntu-22.04"}]' : '') +
          ((inputs.build_macos_x86_64 == true)  ? '[{"name":"x86_64-apple-darwin","runner":"macos-13"}]' : '') +
          ((inputs.build_macos_arm64 == true)  ? '[{"name":"aarch64-apple-darwin","runner":"macos-14"}]' : '') +
          ((inputs.build_windows_x64 == true)  ? '[{"name":"x86_64-pc-windows-msvc","runner":"windows-latest"}]' : '')
          ).replaceAll('][',',') || '[]') }}

    name: build-${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Download KLUR Toolchain (Ubuntu)
        if: matrix.os.name == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          REL="https://pop.squareweb.app/v1/releases/latest?product=klur"
          DL=$(curl -fsSL "$REL" \
            | jq -r --arg name "klur-${{ matrix.os.name }}.zip" '
              .assets[]
              | select(.name == $name)
              | .download_url
            ')

          if [[ -z "$DL" || "$DL" == "null" ]]; then
            echo "Could not resolve KLUR artifact URL for ${{ matrix.os.name }}"
            exit 1
          fi

          curl -fSL -o klur.zip "https://pop.squareweb.app$DL"
          rm -rf /tmp/klur
          mkdir -p /tmp/klur
          unzip -o -q klur.zip -d /tmp/klur

          chmod +x /tmp/klur/klur
          sudo cp /tmp/klur/klur /usr/local/bin/klur
          echo "$HOME/.klur/bin" >> "$GITHUB_PATH"

      - name: Download KLUR Toolchain (macOS)
        if: matrix.os.name == 'x86_64-apple-darwin' || matrix.os.name == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail

          REL="https://pop.squareweb.app/v1/releases/latest?product=klur"
          DL=$(curl -fsSL "$REL" \
            | jq -r --arg name "klur-${{ matrix.os.name }}.zip" '
              .assets[]
              | select(.name == $name)
              | .download_url
            ')

          # The KLUR release only ships x86_64-apple-darwin; Apple Silicon runners
          # (aarch64-apple-darwin) fall back to it via Rosetta.
          if [[ -z "$DL" || "$DL" == "null" ]]; then
            DL=$(curl -fsSL "$REL" \
              | jq -r '
                .assets[]
                | select(.name == "klur-x86_64-apple-darwin.zip")
                | .download_url
              ')
          fi

          if [[ -z "$DL" || "$DL" == "null" ]]; then
            echo "Could not resolve KLUR artifact URL for ${{ matrix.os.name }}"
            exit 1
          fi

          curl -fSL -o klur.zip "https://pop.squareweb.app$DL"
          rm -rf /tmp/klur
          mkdir -p /tmp/klur
          unzip -o -q klur.zip -d /tmp/klur

          chmod +x /tmp/klur/klur
          sudo cp /tmp/klur/klur /usr/local/bin/klur
          echo "$HOME/.klur/bin" >> "$GITHUB_PATH"

      - name: Download KLUR Toolchain (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $json = Invoke-RestMethod `
            -Uri "https://pop.squareweb.app/v1/releases/latest?product=klur"

          $name = "klur-" + ${{ matrix.os.name }} + ".zip"
          $asset = $json.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1

          if (-not $asset) {
            throw "Could not resolve KLUR artifact URL for $name"
          }

          $url = "https://pop.squareweb.app" + $asset.download_url
          Invoke-WebRequest -Uri $url -OutFile klur.zip

          if (Test-Path "C:\klur") {
            Remove-Item -Path "C:\klur" -Recurse -Force
          }
          Expand-Archive -Path klur.zip -DestinationPath "C:\klur" -Force
          "C:\klur" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Standalone Jaciup Binary (Unix)
        if: matrix.os.name != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          klur build \
            src/init.luau \
            --output dist/jaciup

          chmod +x dist/jaciup

          cd dist
          zip -j -9 \
            "../jaciup-${{ matrix.os.name }}.zip" \
            jaciup

      - name: Build Standalone Jaciup Binary (Windows)
        if: matrix.os.name == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          C:\klur\klur.cmd build \
            src/init.luau \
            --output dist/jaciup.exe

          7z a `
            -mx=9 `
            "jaciup-${{ matrix.os.name }}.zip" `
            ".\dist\jaciup.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaciup-${{ matrix.os.name }}
          path: jaciup-${{ matrix.os.name }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine Version Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"

            if [[ "$VER" != v* ]]; then
              VER="v$VER"
            fi

            echo "version=$VER" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find artifacts \
            -type f \
            -name "*.zip" \
            -exec cp {} release-assets/ \;

          cd release-assets

          for f in *.zip; do
            sha256sum "$f" |
              awk '{print $1}' \
              > "$f.sha256"
          done

          sha256sum *.zip > SHA256SUMS.txt

          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
          generate_release_notes: true
